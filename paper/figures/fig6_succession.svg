<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" font-family="Helvetica,Arial,sans-serif">
<title>Connection succession chain</title>
<rect width="880" height="230" fill="white"/>
<text x="20" y="30" font-size="18" font-weight="bold">Connection succession chain (E4 governance fixture)</text>
<text x="20" y="50" font-size="11" fill="#555">source: E4 chain.json + raw L5 models/data.jsonl (superseded_by links)</text>
<defs><marker id="ar3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#33475b"/></marker></defs>
<rect x="40" y="90" width="230" height="86" rx="8" fill="#eef3fb" stroke="#33475b"/>
<text x="155" y="112" font-size="12" font-weight="bold" text-anchor="middle">allocated (add)</text>
<text x="155" y="132" font-size="10" text-anchor="middle">mdl_179372748462100001</text>
<text x="155" y="150" font-size="10" text-anchor="middle">status=retired</text>
<text x="155" y="166" font-size="10" text-anchor="middle">superseded_by=mdl_179372748462300002</text>
<line x1="270" y1="133" x2="330" y2="133" stroke="#33475b" stroke-width="1.4" marker-end="url(#ar3)"/>
<rect x="330" y="90" width="230" height="86" rx="8" fill="#eef3fb" stroke="#33475b"/>
<text x="445" y="112" font-size="12" font-weight="bold" text-anchor="middle">successor (privacy_change)</text>
<text x="445" y="132" font-size="10" text-anchor="middle">mdl_179372748462300002</text>
<text x="445" y="150" font-size="10" text-anchor="middle">status=retired</text>
<text x="445" y="166" font-size="10" text-anchor="middle">superseded_by=mdl_179372748462500003</text>
<line x1="560" y1="133" x2="620" y2="133" stroke="#33475b" stroke-width="1.4" marker-end="url(#ar3)"/>
<rect x="620" y="90" width="230" height="86" rx="8" fill="#eef3fb" stroke="#33475b"/>
<text x="735" y="112" font-size="12" font-weight="bold" text-anchor="middle">restored (undo)</text>
<text x="735" y="132" font-size="10" text-anchor="middle">mdl_179372748462500003</text>
<text x="735" y="150" font-size="10" text-anchor="middle">status=retired</text>
<text x="735" y="166" font-size="10" text-anchor="middle">superseded_by=None</text>
<text x="40" y="205" font-size="11" fill="#555">ids are immutable: each mutation mints a NEW mdl_* and retires the old one with superseded_by; the audit graph records successor_ref.</text>
</svg>
